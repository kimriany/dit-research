experiment:
  name: e3_dit_b_front_b
  group: e3_front_b
  phase: development
  output_root: outputs

data:
  dataset: cifar10
  root: ${RIANY_DATA:-./datasets}
  validation_fraction: 0.1
  split_seed: 20260712
  fake_size: 0
  num_workers: 8
  download: true

model:
  image_size: 32
  in_channels: 3
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  num_classes: 10
  class_dropout_prob: 0.1
  mlp_ratio: 5.0
  allocation:
    kind: frontloaded
    strength: 1.0
    multiple_of: 8

diffusion: {timesteps: 1000, schedule: linear, beta_start: 0.0001, beta_end: 0.02}
train:
  {batch_size: 128, grad_accum_steps: 1, max_steps: 100000, learning_rate: 0.0001,
   weight_decay: 0.0, ema_decay: 0.9999, precision: bf16, gradient_clip: 1.0,
   log_every: 100, validation_every: 1000, validation_batches: 80,
   checkpoint_every: 5000, sample_every: 5000}
sampling: {method: ddim, steps: 50, eta: 0.0, cfg_scale: 1.5, preview_count: 40, clip_denoised: true}
evaluation: {fid_samples_pilot: 5000, fid_samples_final: 50000, fid_reference_split: train, fid_mode: clean}
runtime: {device: auto, compile: false, deterministic: false, allow_tf32: true}
seeds: {base: 11}
