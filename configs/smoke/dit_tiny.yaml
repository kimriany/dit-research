experiment:
  name: smoke_tiny
  group: smoke
  phase: smoke
  output_root: outputs

data:
  dataset: fake
  root: ${RIANY_DATA:-./datasets}
  validation_fraction: 0.1
  split_seed: 20260712
  fake_size: 128
  num_workers: 0
  download: false

model:
  image_size: 32
  in_channels: 3
  patch_size: 4
  hidden_size: 192
  depth: 6
  num_heads: 3
  num_classes: 10
  class_dropout_prob: 0.1
  mlp_ratio: 4.0
  allocation:
    kind: uniform
    strength: 0.0
    multiple_of: 8

diffusion:
  timesteps: 100
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

train:
  batch_size: 2
  grad_accum_steps: 1
  max_steps: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  ema_decay: 0.999
  precision: fp32
  gradient_clip: 1.0
  log_every: 1
  validation_every: 5
  validation_batches: 2
  checkpoint_every: 3
  sample_every: 3

sampling:
  method: ddim
  steps: 5
  eta: 0.0
  cfg_scale: 1.5
  preview_count: 8
  clip_denoised: true

evaluation:
  fid_samples_pilot: 5000
  fid_samples_final: 50000
  fid_reference_split: train
  fid_mode: clean

runtime:
  device: auto
  compile: false
  deterministic: false
  allow_tf32: true

seeds:
  base: 0
