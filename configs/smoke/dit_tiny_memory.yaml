experiment:
  name: smoke_tiny_memory
  group: noise_adaptive_memory
  phase: smoke
  output_root: outputs

data:
  dataset: fake
  root: ${RIANY_DATA:-./datasets}
  validation_fraction: 0.2
  split_seed: 20260712
  fake_size: 32
  num_workers: 0
  download: false

model:
  image_size: 8
  in_channels: 3
  patch_size: 2
  hidden_size: 48
  depth: 6
  num_heads: 4
  num_classes: 10
  class_dropout_prob: 0.1
  mlp_ratio: 2.0
  allocation:
    kind: uniform
    strength: 0.0
    multiple_of: 8
  memory:
    kind: hybrid_gdn2
    gate_mode: adaptive
    block_indices: [2, 5]
    scan_pattern: lr,rl,tb,bt
    gate_rank: 16
    lambda_hidden_size: 8
    log_snr_clip: 20.0
    backend: reference

diffusion:
  timesteps: 10
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

train:
  batch_size: 2
  grad_accum_steps: 1
  max_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  ema_decay: 0.999
  precision: fp32
  gradient_clip: 1.0
  log_every: 1
  validation_every: 2
  validation_batches: 1
  checkpoint_every: 2
  sample_every: 4

sampling:
  method: ddim
  steps: 2
  eta: 0.0
  cfg_scale: 1.5
  preview_count: 2
  clip_denoised: true

evaluation:
  fid_samples_pilot: 100
  fid_samples_final: 100
  fid_reference_split: train
  fid_mode: clean

runtime:
  device: cpu
  compile: false
  deterministic: false
  allow_tf32: false

seeds:
  base: 0
